syntax = "proto3";

package core_api;

option go_package = "./core_api";

import "basic/pagination.proto";
import "basic/http.proto";
import "core_api/user.proto";

// 数据看板

// 指标总览
message DashboardGetDataOverviewReq {
  optional string unitId = 1;
  optional int64 startTime = 10;
  optional int64 endTime = 11;
}
message DashboardGetDataOverviewResp {
  int32 totalUsers = 1;
  int32 weeklyIncreaseUsers = 2;
  double weeklyIncreaseUsersRate = 3;
  optional int32 activeUsers = 4;
  optional int32 weeklyIncreaseActiveUsers = 5;
  optional double weeklyIncreaseActiveUsersRate = 6;
  int32 totalConversations = 7;
  int32 weeklyIncreaseConversations = 8;
  double weeklyIncreaseConversationsRate = 9;
  // minutes
  double averageTimePerConversation = 10;
  // minutes
  double weeklyIncreaseAverageTimePerConversation = 11;
  double weeklyIncreaseAverageTimePerConversationRate = 12;
  int32 alarmUsers = 13;
  int32 weeklyIncreaseAlarmUsers = 14;
  double weeklyIncreaseAlarmUsersRate = 15;
  optional int32 totalUnits = 16;
  optional int32 weeklyIncreaseUnits = 17;
  optional double weeklyIncreaseUnitsRate = 18;
  int32 code = 255;
  string msg = 256;
}

// 学生使用趋势
message DashboardGetDataTrendReq {
  optional string unitId = 1;
  optional int64 startTime = 10;
  optional int64 endTime = 11;
}
message DashboardGetDataTrendResp {
  // 近一周学生活跃趋势
  repeated TrendPoint activePoints = 1;
  // 近一周对话频率趋势
  repeated TrendPoint conversationPoints = 2;
  // 对话时间分布
  repeated conversationDuration conversationDurations = 3;
  // 风险用户分布-按年级
  optional RiskDistributionByGrade riskDistribution = 4;
  int32 code = 255;
  string msg = 256;
}
message TrendPoint {
  // 1=Mon ... 7=Sun
  int32 week = 1;
  // 0–23
  int32 hour = 2;
  int32 count = 3;
}
message conversationDuration {
  // RangeKey 代表时间区间索引：
  // 1: 0-5 min
  // 2: 6-10 min
  // 3: 11-20 min
  // 4: 21-30 min
  // 5: 31-60 min
  // 6: 61-120 min
  // 7: 120+ min
  int32 key = 1;

  // Count 该区间内的会话总数
  int32 count = 2;
}
message RiskDistributionByGrade {
  // key: grade; value: ratio
  map<int32, int32> ratio = 1;
  int32 total = 2;
}

// 管理端-列出单位
message DashboardListUnitsReq {}
message DashboardListUnitsResp {
  repeated DashboardUnit units = 1;
  int32 code = 255;
  string msg = 256;
}
message DashboardUnit {
  string type = 1;
  string name = 2;
  string property = 3;
  int32 userCount = 4;
  double averageConversationMinutes = 5;
  int32 riskUserCount = 6;
  int64 updateTime = 7;
  string id = 8;
}

// 情绪与心理健康趋势
message DashboardGetPsychTrendReq {
  optional string unitId = 1;
  optional int64 startTime = 10;
  optional int64 endTime = 11;
}
message DashboardGetPsychTrendResp {
  // 情绪分布
  EmotionRatio emotionRatio = 1;
  // 分性别的风险等级统计
  repeated RiskDistribution risks = 2;
  // 关键词 用于词云
  Keywords keywords = 3;
  int32 code = 255;
  string msg = 256;
}
message RiskDistribution {
  // 1-4: High | Medium | Low | Normal
  int32 level = 1;
  // 0=all 1=male 2=female
  int32 gender = 2;
  int32 count = 3;
}
message Keywords {
  map<string, int32> keywordMap = 1;
  int32 keyTotal = 2;
}
message EmotionRatio {
  // 0-5: Unknown | Danger | Depress |Anxiety | Negative | Normal
  map<int32, int32> ratio = 1;
  int32 total = 2;
}



// 预警管理
message DashboardGetAlarmOverviewReq {
  string unitId = 1;
  optional int64 startTime = 10;
  optional int64 endTime = 11;
}
message DashboardGetAlarmOverviewResp {
  // 当前高风险用户总数
  int32 total = 1;
  // 当前已处理数
  int32 processed = 2;
  // 当前待处理数
  int32 pending = 3;
  // 当前需追踪数
  int32 track = 4;
  // 对比上周总数变化百分比
  double totalChange = 5;
  // 对比上周已处理变化百分比
  double processedChange = 6;
  // 对比上周待处理变化百分比
  double pendingChange = 7;
  // 对比上周需追踪变化百分比
  double trackChange = 8;
  int32 code = 255;
  string msg = 256;
}

message DashboardListAlarmRecordsReq {
  string unitId = 1;
  // 0-5: Unknown | Danger | Depress |Anxiety | Negative | Normal
  optional int32 emotion = 2;
  // 处理状态 1-2: Processed | Pending
  optional int32 status = 3;
  optional string keyword = 4;
  basic.PaginationOptions paginationOptions = 5;
}
message DashboardListAlarmRecordsResp {
  repeated AlarmRecord records = 1;
  basic.Pagination pagination = 2;
  int32 code = 255;
  string msg = 256;
}

message DashboardUpdateAlarmReq {
  AlarmRecord alarm = 1;
}
message DashboardUpdateAlarmResp {
  int32 code = 255;
  string msg = 256;
}

message AlarmRecord {
  // 唯一Id
  string id = 1;
  // 情绪状态 0-5: Unknown | Danger | Depress |Anxiety | Negative | Normal
  int32 emotion = 2;
  // 关键词列表
  repeated string keywords = 3;
  // 处理状态 1-2: Processed | Pending
  int32 status = 4;
  // 用户信息
  core_api.UserVO user = 5;
  // 总对话轮数
  int32  totalConversationRounds = 6;
  // 上次对话时间（时间戳）
  int64  lastConversationTime = 7;
}



// 用户管理
message ClassInfo {
  int32 class = 1;
  int32 userNum = 2;
  int32 alarmNum = 3;
  string teacherName = 4;
  string teacherPhone = 5;
}

message GradeInfo {
  int32 grade = 1;
  repeated ClassInfo classes = 2;
}

// 按班级+年级列出用户
message DashboardListClassesReq {
  string unitId = 1;
  optional int32 grade = 2;
  optional int32 class = 3;
}
message DashboardListClassesResp {
  repeated GradeInfo grades = 1;
  int32 code = 255;
  string msg = 256;
}

message RiskUser {
  core_api.UserVO user = 1;
  // 1-4: High | Medium | Low | Normal
  int32 level = 2;
  // 总对话轮数
  int32  totalConversationRounds = 3;
  // 上次对话时间（分钟时间戳）
  int64  lastConversationTime = 4;
  repeated string keywords = 5;
}

message DashboardListUsersReq{
  string unitId = 1;
  optional int32 grade = 2;
  optional int32 class = 3;
  // 1-4: High | Medium | Low | Normal
  optional int32 level = 4;
  // 0=all 1=male 2=female
  optional int32 gender = 5;
  optional string keyword = 6;
  basic.PaginationOptions paginationOptions = 7;
}
message DashboardListUsersResp {
  repeated RiskUser riskUsers = 1;
  basic.Pagination pagination = 2;
  int32 code = 255;
  string msg = 256;
}


/*对话记录*/

// 获取用户对话记录列表
message DashboardUserConvRecordsReq {
  string userId = 1;
  basic.PaginationOptions paginationOptions = 2;
}
message DashboardUserConvRecordsResp {
  core_api.UserVO user = 1;
  UserConvTrend userConvTrend = 2;
  repeated ConvDetail convDetail = 3;
  basic.Pagination pagination = 4;
  int32 code = 255;
  string msg = 256;
}

message UserConvTrend {
  repeated TrendPoint trendPoints = 1;
}
message ConvDetail {
  // 对话时间
  int64 time = 1;
  // 摘要
  string digest = 2;
  // 关键词（词云）
  Keywords keywords = 3;
  // 对话id
  string conversationId = 4;
}

// 查看报表详情
message DashboardGetReportReq {
  string ConversationId = 1;
}

// 评估分析各维度消息
// === Problem ===
message ProblemItem {
  string category = 1;
  string subcategory = 2;
}
message AnalysisProblem {
  ProblemItem primary = 1;
  repeated ProblemItem secondary = 2;
}
// === Emotion ===
message AnalysisEmotion {
  repeated string type = 1;
  string intensity = 2;
}
// === Support ===
message AnalysisSupport {
  bool family = 1;
  bool teacher = 2;
  bool friend = 3;
  repeated string other = 4;
  repeated string protectiveResources = 5;
}
// === Function ===
message AnalysisFunction {
  string learning = 1;
  string sleep = 2;
  string diet = 3;
  string interpersonal = 4;
  string dailyLife = 5;
}
// === Distress ===
message AnalysisDistress {
  string level = 1;
  repeated string reason = 2;
}
// === Risk ===
message RiskScore {
  int32 currentIdeation = 1;
  int32 history = 2;
  int32 currentStress = 3;
  int32 protectiveResources = 4;
  int32 mentalHealthHistory = 5;
  int32 total = 6;
}
message ProfileSection {
  string summary = 1;
  repeated string items = 2;
}
message RiskProfile {
  ProfileSection currentRisk = 1;
  ProfileSection stressors = 2;
  ProfileSection riskFactors = 3;
  ProfileSection protectiveFactors = 4;
  ProfileSection informationGap = 5;
  message CurrentSafety {
    string summary = 1;
    string status = 2;
  }
  CurrentSafety currentSafety = 6;
}
message AnalysisRisk {
  string level = 1;
  RiskScore score = 2;
  RiskProfile profile = 3;
  repeated string evidence = 4;
  string action = 5;
}
// === Confidence ===
message AnalysisConfidence {
  string overall = 1;
  string risk = 2;
  string reason = 3;
}
// === Analysis ===
message ReportAnalysis {
  AnalysisProblem problem = 1;
  AnalysisEmotion emotion = 2;
  repeated string cognition = 3;
  repeated string behavior = 4;
  string duration = 5;
  repeated string trigger = 6;
  repeated string coping = 7;
  AnalysisSupport support = 8;
  string helpSeeking = 9;
  AnalysisFunction function = 10;
  AnalysisDistress distress = 11;
  AnalysisRisk risk = 12;
  AnalysisConfidence confidence = 13;
  repeated string missingInfo = 14;
}

// 简易报告各板块消息
message ReportEmotion {
  string type = 1;
  string intensity = 2;
}
message ReportRiskObs {
  string level = 1;
  string evidence = 2;
}
message ReportSeverity {
  string level = 1;
  string basis = 2;
}
message ReportSummary {
  string mainProblem = 1;
  string emotionState = 2;
  string severity = 3;
  string riskLevel = 4;
  string focus = 5;
}
message SimpleReportMsg {
  string mainProblem = 1;
  ReportEmotion emotion = 2;
  string thoughts = 3;
  repeated string behaviors = 4;
  repeated string needs = 5;
  string duration = 6;
  string functionImpact = 7;
  string triggers = 8;
  string coping = 9;
  string support = 10;
  string helpSeeking = 11;
  ReportRiskObs riskObservation = 12;
  ReportSeverity severityAssessment = 13;
  ReportSummary summary = 14;
  string providedSupport = 15;
  repeated string suggestions = 16;
}

message DashboardGetReportResp {
  // 兼容旧字段: 标题
  string title = 1;
  // 兼容旧字段: 话题列表
  repeated string topics = 2;
  // 兼容旧字段: 对话摘要
  string digest = 3;
  // 兼容旧字段: 情绪状态 0-5: Unknown | Danger | Depress |Anxiety | Negative | Normal
  int32 emotion = 4;
  // 兼容旧字段: 详细分析内容
  string body = 5;
  // 兼容旧字段: 是否需要告警
  bool need_alarm = 6;
  // 兼容旧字段: 报表id
  string reportId = 7;
  // 兼容旧字段: 建议与反馈
  repeated string suggestions = 8;
  // 关键词及权重(百分比)
  map<string, double> keywordPercent = 9;
  // 报表状态 1 Processing | 2 Success | -1 Deleted
  int32 reportStatus = 10;
  // 心理老师角色ID
  string characterId = 11;
  // 心理老师姓名
  string characterName = 12;
  // 心理老师音色
  string characterVoice = 13;
  // 心理老师形象图片URL
  string characterImage = 14;
  // 评估分析（13维度）
  ReportAnalysis analysis = 15;
  // 简易报告（16板块）
  SimpleReportMsg simpleReport = 16;
  int32 code = 255;
  string msg = 256;
}

// 获取单位下对话记录列表
message DashboardUnitConvRecordsReq {
  optional string unitId = 1;
  basic.PaginationOptions paginationOptions = 2;
}
message DashboardUnitConvRecordsResp {
  repeated ConvOverview conversationList = 1;
  basic.Pagination pagination = 3;
  int32 code = 255;
  string msg = 256;
}

message ConvOverview {
  string convId = 1;
  UserVO user = 2;
  string title = 3;
  int64 time = 4;
  bool needAlarm = 5;
}

message DashboardCreateRemarkReq {
  string userId = 1;
  string unitId = 2;
  string remark = 3;
}
message DashboardCreateRemarkResp {
  int32 code = 255;
  string msg = 256;
}