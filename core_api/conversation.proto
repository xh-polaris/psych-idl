syntax = "proto3";

package core_api;

option go_package = "./core_api";

import "basic/pagination.proto";
import "google/protobuf/struct.proto";
import "basic/http.proto";


/* 用户端 */
// 对话相关

// 新建对话
message CreateConversationReq {}
message CreateConversationResp {
  string conversationId = 1;
  int32 code = 255;
  string msg = 256;
}

// 对话列表
message ListConversationsReq {
  basic.PaginationOptions paginationOptions = 1;
  string startDate = 2;
  string endDate = 3;
}
message ListConversationsResp {
  repeated ConversationVO conversationList = 1;
  basic.Pagination pagination = 2;
  int32 code = 255;
  string msg = 256;
}

// 获得单次对话下的历史消息
message GetSingleConvReq {
  basic.PaginationOptions paginationOptions = 1;
  string conversationId = 2;
}
message GetSingleConvResp {
  basic.Pagination pagination = 1;
  repeated Message messageList = 2;
  int32 code = 255;
  string msg = 256;
}


message ConversationVO {
  string conversationId = 1;
  // 对话标题
  string brief = 2;
  int64 createTime = 3;
  int64 updateTime = 4;
  string date = 5;
  // 对话角色ID，绑定单次对话与character
  string characterId = 6;
}

message Message {
  string content = 1;
  // 角色, system/assistant/user/tool, 依次为1,2,3,4
  int32 role = 2;
  // 消息索引
  int32 index = 3;
}

// 按天获取用户所有对话消息
message GetConvByDateReq {
  basic.PaginationOptions paginationOptions = 1;
  string date = 2;
  string userId = 3;
}
message GetConvByDateResp {
  basic.Pagination pagination = 1;
  repeated ConvByDateMessage messageList = 2;
  int32 code = 255;
  string msg = 256;
}

message ConvByDateMessage {
  string conversationId = 1;
  string content = 2;
  int32 role = 3;
  int32 index = 4;
  int64 createTime = 5;
}

// SSEEvent
message SSEEvent {
  // 事件数据
  string eventData = 1;
  // 事件id
  int32 eventId = 2;
  // 事件类型
  int32 eventType = 3;
}