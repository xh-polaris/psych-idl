syntax = "proto3";

package core_api;

option go_package = "./core_api";

import "core_api/openapi.proto";

message ModelLabListModelsReq {}

message ModelLabModel {
  string id = 1;
  string name = 2;
  string provider = 3;
  string model = 4;
  bool report_enabled = 5 [json_name = "reportEnabled"];
}

message ModelLabListModelsResp {
  repeated ModelLabModel models = 1;
  string strategy_model_id = 2 [json_name = "strategyModelID"];
  string strategy_prompt = 3 [json_name = "strategyPrompt"];
  string dialogue_prompt = 4 [json_name = "dialoguePrompt"];
  int32 code = 255;
  string msg = 256;
}

message ModelLabCreateSessionReq {
  repeated string chat_model_ids = 1 [json_name = "chatModelIDs"];
  repeated string report_model_ids = 2 [json_name = "reportModelIDs"];
}

message ModelLabSession {
  string id = 1;
  repeated string chat_model_ids = 2 [json_name = "chatModelIDs"];
  repeated string report_model_ids = 3 [json_name = "reportModelIDs"];
  int64 created_at = 4 [json_name = "createdAt"];
  int64 expires_at = 5 [json_name = "expiresAt"];
}

// 工作区中展示的评测会话元数据。实际多轮消息由分支接口读取，避免在工作区
// 配置中重复保存对话内容。
message ModelLabWorkspaceSession {
  string id = 1;
  repeated string chat_model_ids = 2 [json_name = "chatModelIDs"];
  repeated string report_model_ids = 3 [json_name = "reportModelIDs"];
  int64 created_at = 4 [json_name = "createdAt"];
  int64 expires_at = 5 [json_name = "expiresAt"];
  string title = 6;
  string strategy_model_id = 7 [json_name = "strategyModelID"];
  string active_chat_model_id = 8 [json_name = "activeChatModelID"];
  string prompt_set_id = 9 [json_name = "promptSetID"];
  repeated ModelLabModelGroup model_groups = 10 [json_name = "modelGroups"];
  string active_model_group_id = 11 [json_name = "activeModelGroupID"];
}

message ModelLabPromptSet {
  string id = 1;
  string title = 2;
  string strategy_prompt = 3 [json_name = "strategyPrompt"];
  string dialogue_prompt = 4 [json_name = "dialoguePrompt"];
  int64 updated_at = 5 [json_name = "updatedAt"];
}

message ModelLabModelGroup {
  string id = 1;
  string name = 2;
  string strategy_model_id = 3 [json_name = "strategyModelID"];
  string chat_model_id = 4 [json_name = "chatModelID"];
}

message ModelLabPromptRevision {
  string id = 1;
  string prompt_set_id = 2 [json_name = "promptSetID"];
  string prompt_set_title = 3 [json_name = "promptSetTitle"];
  string prompt_type = 4 [json_name = "promptType"];
  string before = 5;
  string after = 6;
  int64 created_at = 7 [json_name = "createdAt"];
}

message ModelLabLoginReq {
  string username = 1;
  string password = 2;
}

message ModelLabLoginResp {
  string token = 1;
  int64 expires_at = 2 [json_name = "expiresAt"];
  int32 code = 255;
  string msg = 256;
}

message ModelLabGetWorkspaceReq {}

message ModelLabGetWorkspaceResp {
  repeated ModelLabWorkspaceSession sessions = 1;
  repeated ModelLabPromptSet prompt_sets = 2 [json_name = "promptSets"];
  repeated ModelLabModelGroup model_groups = 3 [json_name = "modelGroups"];
  repeated ModelLabPromptRevision prompt_revisions = 4 [json_name = "promptRevisions"];
  int32 code = 255;
  string msg = 256;
}

message ModelLabSaveWorkspaceReq {
  repeated ModelLabWorkspaceSession sessions = 1;
  repeated ModelLabPromptSet prompt_sets = 2 [json_name = "promptSets"];
  repeated ModelLabModelGroup model_groups = 3 [json_name = "modelGroups"];
  repeated ModelLabPromptRevision prompt_revisions = 4 [json_name = "promptRevisions"];
}

message ModelLabSaveWorkspaceResp {
  repeated ModelLabWorkspaceSession sessions = 1;
  repeated ModelLabPromptSet prompt_sets = 2 [json_name = "promptSets"];
  repeated ModelLabModelGroup model_groups = 3 [json_name = "modelGroups"];
  repeated ModelLabPromptRevision prompt_revisions = 4 [json_name = "promptRevisions"];
  int32 code = 255;
  string msg = 256;
}

message ModelLabDeleteSessionReq {
  string session_id = 1 [json_name = "sessionID"];
}

message ModelLabDeleteSessionResp {
  bool deleted = 1;
  int32 code = 255;
  string msg = 256;
}

message ModelLabCreateSessionResp {
  ModelLabSession session = 1;
  int32 code = 255;
  string msg = 256;
}

message ModelLabTurn {
  string id = 1;
  string user = 2;
  string assistant = 3;
  int64 created_at = 4 [json_name = "createdAt"];
  ModelLabPromptTrace prompt_trace = 5 [json_name = "promptTrace"];
  ModelLabUsage usage = 6;
  int64 response_time_ms = 7 [json_name = "responseTimeMs"];
}

// 每轮对话的提示词追踪。三个字段分开返回，供专家核查策略输出、实际选中的微技能
// 以及最终发送给对话模型的系统提示词。
message ModelLabPromptTrace {
  string strategy_model_id = 1 [json_name = "strategyModelID"];
  string strategy_output = 2 [json_name = "strategyOutput"];
  string skill_text = 3 [json_name = "skillText"];
  string system_prompt = 4 [json_name = "systemPrompt"];
  bool strategy_degraded = 5 [json_name = "strategyDegraded"];
  string strategy_prompt = 6 [json_name = "strategyPrompt"];
  string dialogue_prompt = 7 [json_name = "dialoguePrompt"];
  string strategy_degraded_reason = 8 [json_name = "strategyDegradedReason"];
}

message ModelLabUsage {
  int32 prompt_tokens = 1 [json_name = "promptTokens"];
  int32 completion_tokens = 2 [json_name = "completionTokens"];
  int32 total_tokens = 3 [json_name = "totalTokens"];
}

message ModelLabGetBranchReq {
  string session_id = 1 [json_name = "sessionID"];
  string chat_model_id = 2 [json_name = "chatModelID"];
}

message ModelLabGetBranchResp {
  string session_id = 1 [json_name = "sessionID"];
  string chat_model_id = 2 [json_name = "chatModelID"];
  int64 version = 3;
  repeated ModelLabTurn turns = 4;
  int32 code = 255;
  string msg = 256;
}

// 成功后响应为 text/event-stream：依次发送 prompt_trace、delta、completed 和 [DONE]。
message ModelLabSendTurnReq {
  string session_id = 1 [json_name = "sessionID"];
  string chat_model_id = 2 [json_name = "chatModelID"];
  string content = 3;
  string prompt_override = 4 [json_name = "promptOverride"];
  string strategy_prompt_override = 5 [json_name = "strategyPromptOverride"];
  string dialogue_prompt_override = 6 [json_name = "dialoguePromptOverride"];
  string strategy_model_id = 7 [json_name = "strategyModelID"];
}

message ModelLabSendTurnResp {}

// 报告模型与对话模型可自由组合。服务读取指定聊天模型分支的消息快照，
// 再按 report_model_id 解析 psych-post 的独立上游配置。
message ModelLabGenerateReportReq {
  string session_id = 1 [json_name = "sessionID"];
  string chat_model_id = 2 [json_name = "chatModelID"];
  string report_model_id = 3 [json_name = "reportModelID"];
}

message ModelLabGenerateReportResp {
  OpenApiGenerateReportResp report = 1;
  int32 code = 255;
  string msg = 256;
}
