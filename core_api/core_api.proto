  }
  rpc GetSingleConv (GetSingleConvReq) returns (GetSingleConvResp) {
            option (google.api.http) = {
      post: "/conversation/get_single"
      body: "*"
    };
  }
  rpc GetConvByDate (GetConvByDateReq) returns (GetConvByDateResp) {
            option (google.api.http) = {
      post: "/conversation/get_by_date"
      body: "*"
    };
  }
}